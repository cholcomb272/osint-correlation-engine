name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pip-audit
      - run: pytest -q
      - run: pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm test
      - run: npm run build

  compose-and-browser:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-owner-password-with-more-than-32-chars
      APP_DB_PASSWORD: ci-runtime-password-with-more-than-32-chars
      API_TOKEN: ci-admin-token-with-more-than-thirty-two-characters
      AUDIT_HASH_SALT: ci-audit-hash-salt-with-more-than-32-characters
      HOST_PORT: "8787"
      BIND_ADDRESS: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: docker compose up --build -d
      - run: |
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8787/ready && exit 0
            sleep 2
          done
          docker compose logs
          exit 1
      - working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium
      - working-directory: frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:8787
        run: npm run test:e2e

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
